# Recipients for the sops-encrypted files in ./secrets. Recipients are public
# keys, so this file is safe to commit. A machine's recipient is derived from
# its ed25519 SSH host key, which is also what it decrypts with:
#
#   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
#
# The rules below are the access control, not documentation: sops encrypts each
# file to the union of recipients for the matching rule, so
#   secrets/common.yaml  -> every host's anchor   (shared)
#   secrets/<host>.yaml  -> that host's anchor    (machine only)
# A host that is not a recipient cannot read the file, and a rebuild that tries
# to use it fails at activation.
#
# After changing a recipient:
#   sops updatekeys secrets/<file>.yaml   # add a key
#   sops rotate -i secrets/<file>.yaml    # remove a key: updatekeys alone keeps
#                                         # the old data key readable
keys:
  # vm — `ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub` on the running VM.
  - &vm age13phz4gyw7appdh3j55jpw0hg7ge830ugmwgs684xyqc5vs8rndpqgv6yje

  # dsk — `ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub` on dsk.
  - &dsk age1zx3pmc8xqz9upc067nklfyk8sgsydgng5nky7dy24eepcyyeff7q06eylp

  # srv — `ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub` on srv.
  - &srv age1qu4ffldtxldegk2m39229k9jz5wfamwzhu0msf37e73xxue4q5jqt9dqvy

  # Optional: your own key, so you can edit secrets from a workstation without
  # root on a host. Fill in, uncomment, and add it to the rules you want:
  #   ssh-to-age < ~/.ssh/id_ed25519.pub
  # - &alfrest age1...

creation_rules:
  # Shared by every host. srv's recipient is listed here but the ciphertext is
  # not re-wrapped yet: `sops updatekeys secrets/common.yaml` still needs to run
  # on vm or dsk (docs/secrets.md → "Adding a host", step 3).
  - path_regex: secrets/common\.yaml$
    age:
      - *vm
      - *dsk
      - *srv

  # Machine-only files: exactly one recipient.
  - path_regex: secrets/vm\.yaml$
    age:
      - *vm

  - path_regex: secrets/dsk\.yaml$
    age:
      - *dsk

  # srv: machine-only secrets (SMB/WebDAV passwords and similar).
  - path_regex: secrets/srv\.yaml$
    age:
      - *srv
